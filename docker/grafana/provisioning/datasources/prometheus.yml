global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # Prometheus monitors itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # SNMP Exporter - polls network devices via SNMP
  # The 'targets' are the SNMP devices to monitor
  # For the demo, we poll the WSL host's own snmpd
  - job_name: "snmp"
    scrape_interval: 60s
    static_configs:
      - targets:
          - "host.docker.internal"  # WSL localhost running snmpd
        labels:
          device: "demo-switch"
    metrics_path: /snmp
    params:
      auth: ["public_v2"]
      module: ["if_mib"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "snmp-exporter:9116"

  # To monitor real Cisco devices, add their IPs to targets:
  # - targets:
  #     - "192.168.1.1"   # CORE-RTR
  #     - "192.168.1.2"   # DIST-RTR
  #     - "192.168.1.3"   # ACCESS-RTR
  #   labels:
  #     site: "production"
